name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell + validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck scripts
        run: |
          shellcheck --version
          # error severity: fail on genuine bugs, not style opinions.
          shellcheck --severity=error apply.sh install-jarvis.sh update-jarvis.sh bin/jarvis tests/overlay_smoke.sh \
            installer/brand-installer.sh installer/inject-overlay-stage.sh installer/gen-icons.sh \
            installer/overlay-stage/jarvis-overlay.sh

      - name: Validate skin YAML + branding.map + banner (no third-party deps)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, sys
          d = yaml.safe_load(open("skins/jarvis.yaml", encoding="utf-8"))
          assert isinstance(d, dict) and d.get("name") == "jarvis", "skin invalid"
          assert d["banner_hero"].strip(), "banner_hero empty -> caduceus would leak"
          assert d["banner_logo"].strip(), "banner_logo empty"
          assert d["branding"]["agent_name"] == "JARVIS"
          print("skin OK:", len(d["colors"]), "colors,", len(d["branding"]), "branding keys")

          # branding.map parses into known sections
          secs, cur = {}, None
          for ln in open("branding.map", encoding="utf-8"):
              ln = ln.rstrip("\n")
              if ln.startswith("#") or not ln.strip(): continue
              if ln.startswith("[") and ln.endswith("]"): cur = ln[1:-1]; secs.setdefault(cur, 0); continue
              secs[cur] = secs.get(cur, 0) + 1
          for s in ("protect", "literal", "regex", "command", "word", "glyph"):
              assert s in secs, f"branding.map missing [{s}]"
          print("branding.map OK:", secs)
          PY

      - name: "Windows shim intercepts `jarvis update` (finding #9 parity)"
        run: |
          # bin/jarvis.cmd MUST hand `jarvis update` to update-jarvis.sh rather
          # than straight to hermes.exe. A pure passthrough (the shape this file
          # shipped with) runs upstream's `hermes update` — a git pull over the
          # branded tree — and de-brands the install for every PowerShell/cmd
          # user, while Git Bash users stay protected by bin/jarvis. That
          # asymmetry is invisible in review, so assert it here.
          grep -q 'update-jarvis.sh' bin/jarvis.cmd || {
            echo "::error file=bin/jarvis.cmd::jarvis.cmd no longer hands 'update' to update-jarvis.sh — the finding #9 passthrough regression is back"
            exit 1
          }
          grep -q 'JARVIS_NO_UPDATE_WRAP' bin/jarvis.cmd || {
            echo "::error file=bin/jarvis.cmd::jarvis.cmd update-intercept is missing the JARVIS_NO_UPDATE_WRAP recursion guard"
            exit 1
          }
          echo "jarvis.cmd update-intercept OK"

      - name: Banner renders in every fallback mode
        run: |
          for mode in "" "--ascii" "--no-color" "--plain"; do
            python3 bin/jarvis-banner $mode >/dev/null || { echo "banner failed: $mode"; exit 1; }
          done
          echo "banner OK (all modes)"

  pslint:
    name: PSScriptAnalyzer (PowerShell installers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze (Severity Error)
        shell: pwsh
        run: |
          # (#21) The .ps1 files are the highest-risk scripts in the repo
          # (PS 5.1 NativeCommandError class of bug) and shellcheck can't see
          # them.
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $files = @('dist/jarvis-windows.ps1', 'installer/overlay-stage/jarvis-overlay.ps1')
          $r = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error })
          if ($r.Count -gt 0) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "PSScriptAnalyzer: no errors across $($files.Count) file(s)"

  smoke:
    name: End-to-end overlay smoke (vs upstream Hermes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml

      - name: Run overlay smoke test
        run: bash tests/overlay_smoke.sh

      - name: Tree-wide brand scan (self-test)
        run: |
          # The scanner is the guard against the curated-list blind spot, so
          # prove the guard itself still works. A scanner that silently stopped
          # matching would look exactly like a clean tree.
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/hermes_cli"
          printf 'BANNER = "Welcome to Hermes Agent!"\n' > "$tmp/hermes_cli/leak.py"
          if python3 tests/brand_scan.py "$tmp" >/dev/null 2>&1; then
            echo "::error::brand_scan.py did NOT flag a planted brand string — the guard is broken"
            exit 1
          fi
          echo "brand_scan.py correctly rejects a planted leak"
          # And a clean tree must pass.
          rm -f "$tmp/hermes_cli/leak.py"
          printf 'BANNER = "Welcome to JARVIS!"\n' > "$tmp/hermes_cli/ok.py"
          python3 tests/brand_scan.py "$tmp"
          echo "brand_scan.py accepts a clean tree"
