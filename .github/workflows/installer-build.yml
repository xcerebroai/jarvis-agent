name: Installer build (JARVIS-Setup.exe / .dmg)

# Builds the branded double-click installers from upstream's Tauri bootstrap
# app (hermes-agent/apps/bootstrap-installer): clone hermes -> gen JARVIS icons
# -> brand-installer.sh (Tier-1 rebrand + inject the JARVIS overlay stage) ->
# tauri build. Produces JARVIS-Setup.exe (Windows) and JARVIS-Setup.dmg (macOS),
# uploads them as artifacts, and on a published release attaches them as assets.
#
# Signing is wired but DISABLED until credentials exist: each signing step runs
# only when its secrets are present (see the env guards). Until then CI still
# produces working unsigned installers.

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "apply.sh"
      - "install-jarvis.sh"
      - ".github/workflows/installer-build.yml"
  release:
    types: [published]
  # (#22) Daily canary: upstream drift that breaks the brand/inject anchors
  # fails loudly here instead of on the next release. Weekly was too slow —
  # upstream v0.20.1 broke the injected overlay stage and the version banner,
  # and the gap between the last green weekly run and the next release meant
  # neither was noticed until a release was attempted.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "hermes-agent ref to build against (default: main HEAD)"
        required: false
        default: ""

permissions:
  contents: write   # attach assets to releases

concurrency:
  group: installer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Rasterize the JARVIS icon set once (easy tooling on ubuntu) ----------
  icons:
    name: Generate JARVIS icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin icnsutils
      - name: gen-icons.sh
        run: bash installer/gen-icons.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-icons
          path: |
            installer/assets/icons/**
            installer/assets/jarvis-mark.png
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    needs: icons
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Secrets aren't referenceable in a step's own `if`; hoist presence flags
      # to job-level env (which step `if` CAN see) so signing stays disabled
      # until credentials are added.
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && 'yes' || '' }}
      HAS_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && 'yes' || '' }}
      # Alternate credential model: a Developer ID .p12 plus an Apple ID and an
      # app-specific password, notarized with `notarytool` directly instead of
      # through Tauri's App Store Connect API-key path above. All five must be
      # present — a partial set is treated as absent, so a half-configured repo
      # keeps building unsigned instead of failing the release build.
      HAS_APPLE_P12: ${{ (secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '') && 'yes' || '' }}
      HAS_WIN_P12: ${{ (secrets.WINDOWS_CERT_P12 != '' && secrets.WINDOWS_CERT_PASSWORD != '') && 'yes' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows — JARVIS-Setup.exe
            artifact: JARVIS-Setup.exe
          - os: macos-latest
            label: macOS — JARVIS-Setup.dmg
            artifact: JARVIS-Setup.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Download JARVIS icons
        uses: actions/download-artifact@v4
        with:
          name: jarvis-icons
          path: installer/assets

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
          key: installer-${{ runner.os }}-${{ hashFiles('installer/**') }}
          restore-keys: installer-${{ runner.os }}-

      - name: Clone upstream Hermes
        id: clone
        shell: bash
        run: |
          REF="${{ github.event.inputs.hermes_ref }}"
          git clone --depth 1 ${REF:+--branch "$REF"} https://github.com/NousResearch/hermes-agent hermes-src
          SHA="$(git -C hermes-src rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream HEAD: $SHA"

      - name: Apply JARVIS branding + inject overlay stage
        shell: bash
        env:
          # (#5) Baked into the binary by the injector so shipped installers
          # apply the exact overlay commit this build was tested against.
          JARVIS_OVERLAY_REF: ${{ github.sha }}
        run: bash installer/brand-installer.sh "$PWD/hermes-src"

      - name: Rust check (fast fail on the injected overlay stage)
        shell: bash
        working-directory: hermes-src/apps/bootstrap-installer/src-tauri
        run: cargo check --locked || cargo check

      - name: Install app deps
        working-directory: hermes-src/apps/bootstrap-installer
        run: npm ci || npm install

      # Bake the tested upstream commit as the install-script pin, so the built
      # installer downloads the exact scripts/install.ps1 we validated against.
      # (#4) build.rs reads HERMES_BUILD_PIN_COMMIT (and emits the un-prefixed
      # rustc-env itself) — the previous BUILD_PIN_COMMIT name was silently
      # ignored and installers tracked main HEAD.
      - name: Build (Windows — exe, no bundle)
        if: runner.os == 'Windows'
        working-directory: hermes-src/apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ steps.clone.outputs.sha }}
        run: npx tauri build --no-bundle

      # --- Developer ID keychain import (DORMANT until the .p12 secrets exist) -
      # Must happen BEFORE the build: notarization inspects the .app inside the
      # .dmg, and Apple rejects a bundle that is only ad-hoc signed. Signing the
      # outer .dmg afterwards cannot fix that, so the identity has to be on the
      # keychain while Tauri builds and signs the app.
      # The keychain is throwaway (created in RUNNER_TEMP, deleted in cleanup)
      # and never becomes the default, so it cannot outlive the job.
      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'yes' && env.HAS_APPLE_P12 == 'yes'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/jarvis-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/developer-id.p12"

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Add to the search list (keep the login keychain) so Tauri's codesign
          # invocation finds the identity.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE_P12 contains no 'Developer ID Application' identity — a Mac Development or Apple Distribution cert will not notarize."
            exit 1
          fi
          echo "JARVIS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "JARVIS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "imported Developer ID Application identity $IDENTITY into a throwaway keychain"

      # Signed build — only when Apple secrets exist. Tauri v2 codesigns +
      # notarizes automatically from these env vars.
      - name: Build (macOS — dmg, signed + notarized)
        if: runner.os == 'macOS' && env.HAS_APPLE == 'yes'
        working-directory: hermes-src/apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ steps.clone.outputs.sha }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles dmg

      # Developer ID build — the .p12 path. The identity now lives on the
      # throwaway keychain, so Tauri signs the .app properly (hardened runtime)
      # and the dmg it produces is notarizable. Notarization itself happens
      # after staging, via notarytool. Kept as its own step rather than an env
      # var on the ad-hoc step below: passing an empty APPLE_SIGNING_IDENTITY
      # risks Tauri attempting a signature with an empty identity, which would
      # break the build that is green today.
      - name: Build (macOS — dmg, Developer ID signed)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'yes' && env.HAS_APPLE_P12 == 'yes'
        working-directory: hermes-src/apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ steps.clone.outputs.sha }}
          APPLE_SIGNING_IDENTITY: ${{ env.JARVIS_SIGN_IDENTITY }}
        run: npx tauri build --bundles dmg

      # Unsigned build — NO Apple env (empty APPLE_CERTIFICATE would make Tauri
      # try to import a nonexistent cert and fail); Tauri ad-hoc signs instead.
      - name: Build (macOS — dmg, unsigned/ad-hoc)
        if: runner.os == 'macOS' && env.HAS_APPLE != 'yes' && env.HAS_APPLE_P12 != 'yes'
        working-directory: hermes-src/apps/bootstrap-installer
        env:
          HERMES_BUILD_PIN_COMMIT: ${{ steps.clone.outputs.sha }}
        run: npx tauri build --bundles dmg

      # --- Stage the artifact under a stable JARVIS-Setup name ---------------
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          src="hermes-src/apps/bootstrap-installer/src-tauri/target/release/JARVIS-Setup.exe"
          [ -f "$src" ] || { echo "::error::JARVIS-Setup.exe not found at $src"; ls -R hermes-src/apps/bootstrap-installer/src-tauri/target/release | head -50; exit 1; }
          mkdir -p out && cp "$src" "out/JARVIS-Setup.exe"

      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          dmg="$(find hermes-src/apps/bootstrap-installer/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)"
          [ -n "$dmg" ] || { echo "::error::no .dmg produced"; find hermes-src/apps/bootstrap-installer/src-tauri/target/release/bundle -maxdepth 2 | head -50; exit 1; }
          mkdir -p out && cp "$dmg" "out/JARVIS-Setup.dmg"

      # --- macOS notarization (notarytool) — DORMANT until secrets exist ------
      # Always runs on macOS so the skip reason is visible in the log; the work
      # is gated inside. Signs the dmg with the Developer ID identity imported
      # above, submits it to Apple, waits for the verdict, and staples the
      # ticket so the installer opens offline without a Gatekeeper prompt.
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${HAS_APPLE:-}" = "yes" ]; then
            echo "notarization skipped: already handled by the Tauri signed build (APPLE_SIGNING_IDENTITY is set)"
            exit 0
          fi
          if [ "${HAS_APPLE_P12:-}" != "yes" ]; then
            echo "notarization skipped: no Apple credentials configured"
            exit 0
          fi

          DMG="out/JARVIS-Setup.dmg"
          [ -f "$DMG" ] || { echo "::error::$DMG missing — nothing to notarize"; exit 1; }

          echo "→ signing the disk image"
          codesign --force --timestamp \
            --keychain "$JARVIS_KEYCHAIN" --sign "$JARVIS_SIGN_IDENTITY" "$DMG"

          echo "→ submitting to Apple (this can take several minutes)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          echo "→ stapling the ticket"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t install "$DMG" || true
          echo "macOS installer signed, notarized and stapled"

      - name: Clean up signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${JARVIS_KEYCHAIN:-}" ] && [ -f "$JARVIS_KEYCHAIN" ]; then
            security delete-keychain "$JARVIS_KEYCHAIN" 2>/dev/null || true
            echo "removed throwaway signing keychain"
          fi

      # --- Windows Authenticode (.p12 + signtool) — DORMANT until secrets ----
      # Alternate to Azure Trusted Signing below, for a conventional OV/EV
      # certificate file. Defers to Azure when those secrets are configured so
      # the artifact is never signed twice.
      - name: Code-sign (Windows / signtool + .p12)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_P12: ${{ secrets.WINDOWS_CERT_P12 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:HAS_AZURE -eq 'yes') {
            Write-Host "signing skipped: handled by Azure Trusted Signing"
            exit 0
          }
          if ($env:HAS_WIN_P12 -ne 'yes') {
            Write-Host "signing skipped: no Windows code-signing credentials configured"
            exit 0
          }

          $exe = "out\JARVIS-Setup.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::$exe missing"; exit 1 }

          $pfx = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_P12))

          # Newest Windows SDK signtool on the runner image.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Host "::error::signtool.exe not found on this runner"; exit 1 }

          try {
            & $signtool.FullName sign `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d "JARVIS Setup" $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Windows installer signed with Authenticode"
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # --- Windows signing (Azure Trusted Signing) — DISABLED until secrets --
      - name: Code-sign (Windows / Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_AZURE == 'yes'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Signing status note
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ env.HAS_AZURE }}" != "yes" ] && [ "${{ env.HAS_WIN_P12 }}" != "yes" ]; then
            echo "::notice::Windows installer is UNSIGNED — configure EITHER Azure Trusted Signing (AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET/AZURE_TS_ENDPOINT/AZURE_TS_ACCOUNT/AZURE_TS_CERT_PROFILE) OR a certificate file (WINDOWS_CERT_P12/WINDOWS_CERT_PASSWORD). See docs/SIGNING.md."
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ env.HAS_APPLE }}" != "yes" ] && [ "${{ env.HAS_APPLE_P12 }}" != "yes" ]; then
            echo "::notice::macOS installer is AD-HOC / unnotarized — configure EITHER the Tauri API-key path (APPLE_SIGNING_IDENTITY/APPLE_CERTIFICATE(+PASSWORD)/APPLE_API_ISSUER/APPLE_API_KEY(_PATH)/APPLE_TEAM_ID) OR the notarytool path (APPLE_CERTIFICATE_P12/APPLE_CERTIFICATE_PASSWORD/APPLE_ID/APPLE_TEAM_ID/APPLE_APP_SPECIFIC_PASSWORD). See docs/SIGNING.md."
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" "out/${{ matrix.artifact }}" --clobber

  # --- Attach the terminal-install scripts ----------------------------------
  # The product page's "prefer the terminal?" panel links these by name at
  # releases/latest/download/. Nothing used to upload them, so they were
  # attached by hand and every release that forgot 404'd those links. One job,
  # not the build matrix, so the two runners cannot race on the same upload.
  scripts:
    name: Attach install scripts to the release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload dist/ install scripts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/jarvis-windows.ps1 dist/jarvis-mac.sh --clobber
          echo "attached jarvis-windows.ps1 + jarvis-mac.sh to $TAG"

  # --- Verify, then promote -------------------------------------------------
  # A release's assets are produced BY the release event, so a freshly cut
  # release is empty for as long as the build takes. If it is already marked
  # "latest", releases/latest/download/* 404s for that whole window and the
  # website's download buttons are dead (observed on v1.1.2).
  #
  # So releases are cut as PRERELEASE — /latest keeps pointing at the previous
  # good release — and only promoted here, once every asset is confirmed both
  # listed AND downloadable. If anything is missing the release stays a
  # prerelease and the site keeps serving the last good one. See docs/RELEASING.md.
  finalize:
    name: Verify assets and promote to latest
    if: github.event_name == 'release'
    needs: [build, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Require all four assets, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          REQUIRED="JARVIS-Setup.exe JARVIS-Setup.dmg jarvis-windows.ps1 jarvis-mac.sh"

          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "attached to $TAG:"; printf '%s\n' "$have" | sed 's/^/  /'

          missing=0
          for a in $REQUIRED; do
            printf '%s\n' "$have" | grep -qx -- "$a" || {
              echo "::error::missing release asset: $a"; missing=1; }
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::$TAG stays a prerelease; /latest keeps serving the previous release"
            exit 1; }

          # Listed is not the same as downloadable.
          for a in $REQUIRED; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' \
              "https://github.com/$GH_REPO/releases/download/$TAG/$a" || echo 000)"
            echo "  $a -> HTTP $code"
            [ "$code" = "200" ] || {
              echo "::error::$a is listed but not downloadable (HTTP $code)"; exit 1; }
          done

          gh release edit "$TAG" --prerelease=false --latest
          echo "promoted $TAG to latest"

      - name: Verify /latest/download serves this release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The latest pointer propagates through a CDN; retry rather than
          # trusting a single fixed sleep.
          for a in JARVIS-Setup.exe JARVIS-Setup.dmg jarvis-windows.ps1 jarvis-mac.sh; do
            ok=""
            for _ in 1 2 3 4 5 6; do
              code="$(curl -sSL -o /dev/null -w '%{http_code}' \
                "https://github.com/$GH_REPO/releases/latest/download/$a" || echo 000)"
              [ "$code" = "200" ] && { ok=1; break; }
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::/latest/download/$a never returned 200"; exit 1; }
            echo "  /latest/download/$a -> HTTP 200"
          done
          echo "all four download links live"
